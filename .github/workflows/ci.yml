name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.1
      - name: Ruff check
        run: ruff check tests scripts
      - name: Ruff baseline check (core, new violations only)
        run: ./scripts/ruff_baseline_check.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: pip install fastapi pydantic python-dotenv python-multipart PyYAML bcrypt psutil requests pytest
      - name: Run unit checks
        run: pytest -q
