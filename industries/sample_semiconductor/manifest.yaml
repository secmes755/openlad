id: sample_semiconductor
name: Semiconductor Industry Sample Pack
version: 1.0.0
description: Chip/semiconductor technical document industry sample pack (Open Source Sample), for retrieval and Q&A on datasheets, technical manuals, schematics, and related documents
author: OpenLAD Team
category_mapping:
  - Technical & Product Documents
  - Chip Specifications
  - Technical Manuals
  - Datasheets
  - Circuit Schematics
# Short names callers may declare (`industry=` on upload). The suite config and
# the upload API both say "semiconductor"; the pack id is "sample_semiconductor",
# so without aliases the declaration never bound to this pack.
aliases:
  - semiconductor
  - 半导体
entry_point: "plugin:SemiconductorPlugin"
is_builtin: true
