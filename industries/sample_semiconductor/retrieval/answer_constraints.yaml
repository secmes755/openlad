# 半导体行业答案约束

format_constraints:
  - 技术规格必须给出精确数值和单位
  - 引脚连接必须精确到信号名和引脚号
  - 对比类查询使用 Markdown 表格
  - 引用必须标注页码

depth_constraints:
  - 注意 Min/Typ/Max 值区别，用户问典型值时给 Typ，未指定时列出全部
  - 电气特性需注明测试条件
  - 不同型号/变体参数需区分

prohibited_behaviors:
  - 严禁编造技术参数
  - 严禁基于推断给出结论（如有接口不等于支持某协议）
  - 严禁混淆不同型号的参数

citation_format: "[^页码^]"
table_template: |
  | 型号 | 参数 | Min | Typ | Max | 单位 | 来源 |
  |------|------|-----|-----|-----|------|------|
