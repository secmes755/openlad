# 通用基础包检索规则 —— 只放跨行业公共知识
# 组合语义：list 与行业包并集、dict 同键行业包优先（core/plugins Composed* 实现）。
#
# 基线安全说明：query_expansion / low_value_sections / spec_sections /
# entity_patterns 本版刻意留空 —— 这些 hook 会改变所有租户的检索行为，
# 待 A/B 验证后再增量启用。

# 通用单位词表：spec 事实抽取（ingestion 规则抽取器）的合法单位集合。
# 只影响新入库文档，不回溯既有数据。
spec_extraction:
  compute_units:
    # SI / 物理量
    - V
    - mV
    - kV
    - A
    - mA
    - µA
    - W
    - kW
    - Hz
    - kHz
    - MHz
    - GHz
    - Pa
    - kPa
    - MPa
    - ℃
    - °C
    - mm
    - cm
    - m
    - km
    - g
    - kg
    - s
    - ms
    - "%"
    # 存储/速率
    - KB
    - MB
    - GB
    - TB
    - bps
    - Mbps
    - Gbps
    # 中文计数/财务量级
    - 元
    - 千元
    - 万元
    - 亿元
    - 百万元
    - 万美元
    - 亿美元
    - USD
    - RMB
    - CNY

# 置信度启发式（synthesizer._assess_confidence）的通用单位信号。
# terms 留空：专有名词属领域知识，归行业包。
specificity_vocabulary:
  units:
    - V
    - mV
    - A
    - mA
    - W
    - kW
    - MHz
    - GHz
    - MPa
    - ℃
    - mm
    - KB
    - MB
    - GB
    - Mbps
    - Gbps
    - "%"
    - 元
    - 万元
    - 亿元
  terms: []

# 领域抽取锚点：core 通用锚点（数值/型号词元/长词组）已覆盖公共场景，
# 领域锚点（如法律条文号）由各行业包提供。
evidence_anchor_patterns: []

# 本版刻意留空（见文件头说明）
query_expansion:
  keywords: []
low_value_sections: []
spec_sections: []
entity_patterns: []
spec_query_terms: {}

# 查询侧实体停用词（entity_stopwords）
# 中文企业文档（年报/季报/公告）里的领域通用词：它们在企业语料中
# 几乎每个标题都含，绝不能当"实体"去匹配文档（否则 "公司" 会把所有
# "...股份有限公司..." 标题的文档强行并入 doc_filter，造成跨文档污染）。
# core 只保留领域无关的疑问/元词汇（"多少"/"是什么"），企业文档词汇
# 由本包提供；更细的财报词汇可由 financial 等行业包继续叠加。
entity_stopwords:
  - 公司
  - 集团
  - 股份
  - 有限
  - 责任
  - 公司名称
  - 股票代码
  - 年报
  - 季报
  - 年度报告
  - 季度报告
  - 营业
  - 收入
  - 利润
  - 资产
  - 负债
  - 权益
  - 现金流
  - 营业收入
  - 净利润
  - 总资产
  - 净资产
  - 每股收益
  - 财务
  - 金额
  - 总额
  - 合计

# 报告期词表：只有把年份绑定到"报告类型名词"上才认作文档期别。
#   "2025年年度报告" -> 指定期别 2025
#   "较2024年下降"   -> 2024 只是比较期，不是文档期别
# core 只做期别裁剪这个动作，认哪些名词由本包提供；不声明则不做裁剪。
# 采用正则而非词表，是因为需要否定断言（"年报"不能匹配"年报期"）。
report_epoch_pattern: "((?:19|20)\\d{2})\\s*(?:年|财年)?\\s*(?:年度报告|年报(?!告)|半年度报告|半年报|中期报告|第[一二三四1234]季度报告|季度报告|季报|财报|报告(?!期))"

# 标题抽取时给模型的 doc_type 举例（内容层词汇）。
# 留空则提示词不带举例，由模型自行判断文档类型。
title_derivation:
  doc_type_examples:
    - 年度报告
    - 员工手册
    - 体检报告
    - datasheet
