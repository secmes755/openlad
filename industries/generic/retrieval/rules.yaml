# 通用基础包检索规则 —— 只放跨行业公共知识
# 组合语义：list 与行业包并集、dict 同键行业包优先（core/plugins Composed* 实现）。
#
# 基线安全说明：query_expansion / low_value_sections / spec_sections /
# entity_patterns 本版刻意留空 —— 这些 hook 会改变所有租户的检索行为，
# 待 A/B 验证后再增量启用。

# 通用单位词表：spec 事实抽取（ingestion 规则抽取器）的合法单位集合。
# 只影响新入库文档，不回溯既有数据。
spec_extraction:
  compute_units:
    # SI / 物理量
    - V
    - mV
    - kV
    - A
    - mA
    - µA
    - W
    - kW
    - Hz
    - kHz
    - MHz
    - GHz
    - Pa
    - kPa
    - MPa
    - ℃
    - °C
    - mm
    - cm
    - m
    - km
    - g
    - kg
    - s
    - ms
    - "%"
    # 存储/速率
    - KB
    - MB
    - GB
    - TB
    - bps
    - Mbps
    - Gbps
    # 中文计数/财务量级
    - 元
    - 千元
    - 万元
    - 亿元
    - 百万元
    - 万美元
    - 亿美元
    - USD
    - RMB
    - CNY

# 置信度启发式（synthesizer._assess_confidence）的通用单位信号。
# terms 留空：专有名词属领域知识，归行业包。
specificity_vocabulary:
  units:
    - V
    - mV
    - A
    - mA
    - W
    - kW
    - MHz
    - GHz
    - MPa
    - ℃
    - mm
    - KB
    - MB
    - GB
    - Mbps
    - Gbps
    - "%"
    - 元
    - 万元
    - 亿元
  terms: []

# 领域抽取锚点：core 通用锚点（数值/型号词元/长词组）已覆盖公共场景，
# 领域锚点（如法律条文号）由各行业包提供。
evidence_anchor_patterns: []

# 本版刻意留空（见文件头说明）
query_expansion:
  keywords: []
low_value_sections: []
spec_sections: []
entity_patterns: []
spec_query_terms:
  数量: [count, number]
  多少个: [count, number]
  版本: [version, protocol, support]

# 查询侧实体停用词：仅跨行业疑问词和元信息词。企业报告、产品或
# 其他领域词汇由对应行业包提供。
entity_stopwords:
  - 多少
  - 什么
  - 如何
  - 是否
  - 哪些
  - 怎样
  - 为何
  - 原因
  - 是多少
  - 是什么
  - 怎么样
  - 有哪些
  - 为什么
  - 什么原因
  - 情况
  - 介绍
  - 信息
  - 内容
  - 问题
  - 答案
  - 主要
  - 业务
  - 数据
  - 指标
  - 数值

# 报告期和文档类型示例属于内容层，由对应行业包声明。
report_epoch_pattern: ""
title_derivation:
  doc_type_examples: []

table_request_markers: [表格, table]
table_request_exclusions: []
no_answer_markers:
  - not found
  - no relevant
  - no information
  - 未找到
  - 没有找到
  - 未提及
  - 不包含
  - 无相关
  - does not contain
  - does not mention
planner_no_result_markers:
  - 知识库中没有
  - no documents in the knowledge base

message_rules:
  no_result:
    - pattern: '[\u4e00-\u9fff]'
      text: '根据当前知识库中的文档，未找到相关信息。'
    - pattern: ''
      text: 'No relevant information was found in the available documents.'
  source_excerpts_header:
    - pattern: '[\u4e00-\u9fff]'
      text: '依据原文：'
    - pattern: ''
      text: 'Source excerpts:'
  source_citation:
    - pattern: '[\u4e00-\u9fff]'
      text: '《$title》第 $page 页'
    - pattern: '$title, p.$page'
  source_citation_no_title:
    - pattern: '[\u4e00-\u9fff]'
      text: '第 $page 页'
    - pattern: 'p.$page'

