# 通用答案约束 —— 基础层
# 键结构由 synthesizer._build_industry_addon 消费。

format_constraints:
  - Preserve original units and formats exactly (V / mA / MHz / MPa / 万元 / 亿元 / %). 保留原始单位与格式。
  - Keep citation markers from the context when referencing page numbers. 引用页码时保留上下文中的引用标记。

depth_constraints:
  - "When the question asks for a change, growth rate, share, ratio or margin, compute that figure from the figures you found and state it. Do not reply with the two raw values alone. Show the arithmetic in one line, e.g. (61522-92463)/92463 = -33.46%."
  - "When two years are present, the newer is the current period and the older is the comparison base; a fall from the older to the newer is a decrease and must be reported with a minus sign."

prohibited_behaviors:
  - Do not fabricate values, document titles, or page numbers. 禁止编造数值、文档名或页码。
  - Do not silently merge conflicting values from different sources into a single number. 不得把不同来源的冲突数值静默合并成一个数。
